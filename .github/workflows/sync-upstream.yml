name: Propose upstream sync

on:
  schedule:
    - cron: "38 */1 * * *" # Every 6 hours, UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync-pr
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Create or update upstream sync PR
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          TARGET_BRANCH="${{ github.event.repository.default_branch }}"
          SYNC_BRANCH="sync/upstream"

          PARENT_REPO="$(
            gh api "repos/${GITHUB_REPOSITORY}" --jq '.parent.full_name'
          )"

          if [ -z "$PARENT_REPO" ] || [ "$PARENT_REPO" = "null" ]; then
            echo "This repository does not appear to be a fork."
            exit 1
          fi

          SOURCE_BRANCH="$(
            gh api "repos/${PARENT_REPO}" --jq '.default_branch'
          )"

          git remote add upstream "https://github.com/${PARENT_REPO}.git"
          git fetch origin "${TARGET_BRANCH}"
          git fetch upstream "${SOURCE_BRANCH}"

          # Stop when the fork already contains the latest upstream commit.
          if git merge-base --is-ancestor \
            "upstream/${SOURCE_BRANCH}" \
            "origin/${TARGET_BRANCH}"; then
            echo "Fork is already up to date."
            exit 0
          fi

          # Safely update the dedicated sync branch.
          REMOTE_SHA="$(
            git ls-remote --heads origin "refs/heads/${SYNC_BRANCH}" |
            cut -f1
          )"

          git push origin \
            --force-with-lease="refs/heads/${SYNC_BRANCH}:${REMOTE_SHA}" \
            "upstream/${SOURCE_BRANCH}:refs/heads/${SYNC_BRANCH}"

          # Update the existing PR through its branch, or create a new one.
          PR_URL="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --base "${TARGET_BRANCH}" \
              --head "${SYNC_BRANCH}" \
              --state open \
              --json url \
              --jq '.[0].url // empty'
          )"

          if [ -n "$PR_URL" ]; then
            echo "Updated existing PR: $PR_URL"
          else
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base "${TARGET_BRANCH}" \
              --head "${SYNC_BRANCH}" \
              --title "Sync changes from upstream" \
              --body "Automated proposal to sync \`${PARENT_REPO}:${SOURCE_BRANCH}\` into this fork. Review and merge this PR manually."
          fi
